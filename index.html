
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 1.9 - Formularios HTML</title>
</head>
<body>
<!--form crea un formulario.
action indica a donde se envian los datos
y method indica como se envian. -->
<form action="index.html" method="get">
    <!-- fieldset agrupa datos que pertenecen al mismo apartado. -->
    <fieldset>
        <legend>Datos personales by Chema</legend>
    </fieldset>
</form>
</body>
</html>
